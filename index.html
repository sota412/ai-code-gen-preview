<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Generator - リアルタイムプレビュー</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🤖 AI Code Generator</h1>
            <p class="subtitle">AIがあなたのアイデアをコードに変える</p>
        </header>

        <div class="main-content">
            <!-- 左パネル: 入力エリア -->
            <div class="panel input-panel">
                <div class="panel-header">
                    <h2>📝 プロンプト入力</h2>
                </div>
                <div class="panel-body">
                    <div class="form-group">
                        <label for="apiKey">OpenAI API Key</label>
                        <input 
                            type="password" 
                            id="apiKey" 
                            placeholder="sk-..." 
                            class="input-field"
                        >
                        <small>API Keyはセキュアにブラウザに保存されます</small>
                    </div>

                    <div class="form-group">
                        <label for="prompt">何を作りたいですか？</label>
                        <textarea 
                            id="prompt" 
                            class="textarea-field" 
                            placeholder="例: 青と白のグラデーション背景にボタンがあるシンプルなランディングページを作成してください"
                            rows="8"
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="codeType">コードタイプ</label>
                        <select id="codeType" class="select-field">
                            <option value="html-css-js">HTML + CSS + JavaScript</option>
                            <option value="react">React Component</option>
                            <option value="vue">Vue Component</option>
                        </select>
                    </div>

                    <button id="generateBtn" class="button button-primary">
                        ✨ コード生成
                    </button>
                </div>
            </div>

            <!-- 中央パネル: コード表示 -->
            <div class="panel code-panel">
                <div class="panel-header">
                    <h2>💻 生成されたコード</h2>
                    <div class="code-actions">
                        <button id="copyBtn" class="button button-small" title="コピー">
                            📋 コピー
                        </button>
                        <button id="downloadBtn" class="button button-small" title="ダウンロード">
                            ⬇️ DL
                        </button>
                    </div>
                </div>
                <div class="panel-body">
                    <div id="codeOutput" class="code-output">
                        <pre><code>// コードがここに表示されます</code></pre>
                    </div>
                    <div id="loadingSpinner" class="loading-spinner" style="display: none;">
                        <div class="spinner"></div>
                        <p>AIが考え中...</p>
                    </div>
                </div>
            </div>

            <!-- 右パネル: プレビュー -->
            <div class="panel preview-panel">
                <div class="panel-header">
                    <h2>👁️ リアルタイムプレビュー</h2>
                    <button id="refreshPreviewBtn" class="button button-small" title="更新">
                        🔄 更新
                    </button>
                </div>
                <div class="panel-body">
                    <div id="previewError" class="error-message" style="display: none;"></div>
                    <iframe 
                        id="previewFrame" 
                        class="preview-frame"
                        sandbox="allow-scripts allow-same-origin"
                    ></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
